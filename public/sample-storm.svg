<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="stormSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="60%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#1B261D"/>
    </linearGradient>
    <linearGradient id="waterPond" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="50%" stop-color="#455A64"/>
      <stop offset="100%" stop-color="#2E1C14"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#stormSky)"/>
  <!-- Rain / wind streaks -->
  <line x1="80" y1="20" x2="50" y2="120" stroke="#78909C" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.5"/>
  <line x1="200" y1="10" x2="170" y2="110" stroke="#78909C" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.5"/>
  <line x1="320" y1="30" x2="290" y2="130" stroke="#78909C" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.5"/>
  <!-- Submerged Mud & Water Basin -->
  <path d="M 0 210 Q 150 195 250 215 Q 350 205 400 220 L 400 300 L 0 300 Z" fill="url(#waterPond)"/>
  <!-- Lodged (bent over) paddy stalks -->
  <path d="M 50 250 C 90 240, 160 230, 220 245" stroke="#FDD835" stroke-width="4" stroke-linecap="round"/>
  <path d="M 120 260 C 180 250, 270 240, 340 255" stroke="#C0CA33" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 30 270 C 110 260, 210 255, 310 265" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
  <!-- Submerged Grain Panicles -->
  <circle cx="230" cy="245" r="4" fill="#FFE082"/>
  <circle cx="240" cy="246" r="3.5" fill="#FFE082"/>
  <circle cx="345" cy="256" r="4" fill="#FFE082"/>
  <text x="20" y="35" fill="#FF8A80" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="1">SAMPLE: PHYSICAL DAMAGE — STORM LODGING</text>
</svg>
