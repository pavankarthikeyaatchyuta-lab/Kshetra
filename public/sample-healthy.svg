<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142C1B"/>
      <stop offset="100%" stop-color="#09180E"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="50%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <!-- Field backdrop lines -->
  <path d="M 0 220 Q 200 180 400 230" stroke="#1E4D2B" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 0 250 Q 200 210 400 260" stroke="#1E4D2B" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Healthy Paddy Blade -->
  <path d="M 60 270 Q 180 180 340 50 Q 260 160 140 280 Z" fill="url(#leafGrad)"/>
  <!-- Central Vein -->
  <path d="M 70 268 Q 190 178 338 52" stroke="#81C784" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Secondary Leaf -->
  <path d="M 120 280 Q 220 140 290 80 Q 240 180 170 280 Z" fill="#388E3C" opacity="0.85"/>
  <text x="20" y="35" fill="#81C784" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="1">SAMPLE: PADDY CANOPY — HEALTHY</text>
</svg>
